<style>
/* Panel de lectura para el instructor: encabezado compacto, pestañas y mapas de calor como tablas con la columna del nombre fija.
   Verde azulado como único acento; el ámbar solo marca avisos (tarde, higiene). */
:root {
  --bg: #f3f6f6; --panel: #ffffff; --ink: #11201e; --muted: #546664; --line: #d8e1df; --line-soft: #e8eeed;
  --accent: #0b6b63; --accent-soft: #d6ece9; --warn: #9a5a06; --warn-soft: #fbe9c6; --bad: #a3271b;
  --heat-lo: #edf3f2; --heat-hi: #0a5c55; --t-lo: #11201e; --t-hi: #ffffff; --zero: #9db0ad; --bad-soft: #fbe1dd;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --f-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1312; --panel: #121b1a; --ink: #e3eeec; --muted: #8fa19e; --line: #233230; --line-soft: #1a2624;
    --accent: #47cfc0; --accent-soft: #143a36; --warn: #f0b24a; --warn-soft: #3a2b0b; --bad: #ff8a7d;
    --heat-lo: #172321; --heat-hi: #45cdbd; --t-lo: #e3eeec; --t-hi: #05211e; --zero: #476360; --bad-soft: #3d1813; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1312; --panel: #121b1a; --ink: #e3eeec; --muted: #8fa19e; --line: #233230; --line-soft: #1a2624;
  --accent: #47cfc0; --accent-soft: #143a36; --warn: #f0b24a; --warn-soft: #3a2b0b; --bad: #ff8a7d;
  --heat-lo: #172321; --heat-hi: #45cdbd; --t-lo: #e3eeec; --t-hi: #05211e; --zero: #476360; --bad-soft: #3d1813; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; padding-inline: 16px; padding-block: 20px 48px; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-ui); }
.wrap { max-width: 1480px; margin-inline: auto; display: grid; gap: 18px; min-width: 0; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 17px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
.sub { color: var(--muted); }
.head { display: grid; gap: 6px; }
.head .meta { color: var(--muted); font-size: 13px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* pestañas */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { font: 600 14px var(--f-ui); color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.vista { display: grid; gap: 18px; min-width: 0; }

/* resumen */
.resumen { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.resumen .it { display: grid; }
.resumen .it b { font: 600 22px var(--f-num); font-variant-numeric: tabular-nums; }
.resumen .it span { color: var(--muted); font-size: 12px; }
.resumen .it b small { font-size: 13px; color: var(--warn); font-weight: 500; }

/* controles */
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: 500 13px var(--f-ui); color: var(--muted); background: var(--panel); border: 0; padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
select { font: 500 13px var(--f-ui); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.leyenda { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.leyenda i { display: block; width: 120px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--heat-lo), var(--heat-hi)); border: 1px solid var(--line); }

/* mapas de calor */
.mapa { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 8px; }
table.hm { border-collapse: separate; border-spacing: 2px; width: max-content; min-width: 100%; font-size: 13px; }
table.hm th { font-weight: 600; color: var(--muted); font-size: 12px; padding: 4px 6px; text-align: center; white-space: nowrap; background: var(--panel); }
table.hm th.l, table.hm td.l { text-align: left; }
table.hm td { padding: 0; text-align: center; height: 34px; min-width: 40px; border-radius: 4px; }
table.hm td.nom { position: sticky; left: 0; z-index: 2; background: var(--panel); padding: 0 10px 0 6px; min-width: 230px; max-width: 280px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 0; }
table.hm th.nom { position: sticky; left: 0; z-index: 3; text-align: left; min-width: 230px; }
td.nom .pos { display: inline-block; width: 26px; color: var(--muted); font: 500 12px var(--f-num); text-align: right; margin-right: 8px; }
td.c { background: var(--heat-lo); background: color-mix(in srgb, var(--heat-hi) calc(var(--v, 0) * 100%), var(--heat-lo)); color: var(--t-lo); font-family: var(--f-num); font-variant-numeric: tabular-nums; line-height: 1.05; }
td.c.hi { color: var(--t-hi); }
td.c.z { color: var(--zero); }
td.c b { display: block; font-weight: 600; font-size: 13px; }
td.c small { display: block; font-size: 10px; opacity: .85; font-weight: 400; }
td.c.late small { color: var(--warn); opacity: 1; font-weight: 600; }
td.c.hi.late small { color: inherit; text-decoration: underline; }
td.na { color: var(--zero); font-size: 12px; background: transparent; }
td.tot { font-family: var(--f-num); font-weight: 600; background: var(--line-soft); min-width: 56px; }
tr.pie td { background: transparent; font-family: var(--f-num); font-weight: 600; height: 28px; color: var(--muted); }
tr.pie td.nom { color: var(--muted); font-family: var(--f-ui); }
td.pt { font-family: var(--f-num); font-weight: 600; min-width: 62px; }
.grp th { color: var(--ink); border-bottom: 2px solid var(--line); }
.pend { color: var(--zero); font-style: italic; font-size: 12px; }

/* detalle por aprendiz */
.lista { display: grid; gap: 8px; }
details.ap { border: 1px solid var(--line-soft); border-radius: 8px; background: var(--panel); min-width: 0; }
details.ap > summary { list-style: none; cursor: pointer; padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
details.ap > summary::-webkit-details-marker { display: none; }
details.ap > summary::before { content: "▸"; color: var(--muted); font-size: 12px; }
details.ap[open] > summary::before { content: "▾"; }
details.ap .nombre { font-weight: 600; min-width: 0; }
details.ap .pos { font: 500 12px var(--f-num); color: var(--muted); }
details.ap .score { margin-left: auto; font: 700 15px var(--f-num); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 500 12px var(--f-num); padding: 1px 8px; border-radius: 99px; background: var(--line-soft); color: var(--ink); white-space: nowrap; }
.chip.w { background: var(--warn-soft); color: var(--warn); }
.chip.a { background: var(--accent-soft); color: var(--accent); }
.det { border-top: 1px solid var(--line-soft); padding: 12px; display: grid; grid-template-columns: minmax(250px, 340px) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .det { grid-template-columns: minmax(0, 1fr); } }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 5px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.t td.n, table.t th.n { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl { overflow-x: auto; min-width: 0; }
.barra { display: block; width: 100%; min-width: 60px; height: 8px; border-radius: 4px; background: var(--line-soft); overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.aviso { color: var(--warn); font-size: 12px; }
.nota { color: var(--muted); font-size: 13px; max-width: 110ch; }
.formula { font-family: var(--f-num); font-size: 12px; color: var(--muted); }
code { font-family: var(--f-num); font-size: 12px; background: var(--line-soft); padding: 1px 5px; border-radius: 4px; }
.pie-pagina { color: var(--muted); font-size: 12px; }

/* informe 4: veredicto y galería */
.chip.si { background: var(--accent-soft); color: var(--accent); }
.chip.parcial { background: var(--warn-soft); color: var(--warn); }
.chip.no { background: var(--bad-soft); color: var(--bad); }
.veredictos { display: flex; flex-wrap: wrap; gap: 10px 26px; }
.veredictos div { display: grid; }
.veredictos b { font: 600 24px var(--f-num); }
.galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); gap: 14px; }
.card { border: 1px solid var(--line-soft); border-radius: 10px; overflow: hidden; background: var(--panel); display: grid; align-content: start; min-width: 0; }
.card .shots { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 8px; padding: 10px; background: var(--line-soft); align-items: start; }
.card .shots img { width: 100%; height: auto; display: block; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
.card .sin { padding: 30px 12px; text-align: center; color: var(--muted); font-size: 13px; background: var(--line-soft); }
.card .cuerpo { padding: 10px 12px 12px; display: grid; gap: 6px; }
.card .fila { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card .fila .score { margin-left: auto; font: 700 15px var(--f-num); color: var(--accent); }
.card ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.cita { border-left: 3px solid var(--accent); padding: 4px 12px; color: var(--ink); font-size: 13px; background: var(--line-soft); border-radius: 0 6px 6px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  }

  // ---------- INFORME 7 ----------
  function renderI7() {
    const inf = M.informes.find((i) => i.id === "i7");

    const thead = h("thead", null, h("tr", null, nombreTh(), h("th", null, "Puntaje"), repos.map((r) => h("th", null, r, h("br"), h("span", { class: "num", style: "font-weight:400" }, "% identificadores"))), h("th", null, "Comentarios", h("br"), h("span", { class: "num", style: "font-weight:400" }, "% en español"))));

        repos.map((rp) => { const x = r.repos[rp]; if (!x || x.estado !== "ok") return estadoCelda(x ? x.estado : "sin fork"); const p = pct(x.ids_es, x.ids_total); return celda(dec(p) + " %", Math.min(1, p / 5), { zero: x.ids_es === 0, sub: x.ids_es + "/" + x.ids_total, title: x.ejemplos.length ? "Ejemplos: " + x.ejemplos.join(", ") : "Sin identificadores en español" }); }),

              h("p", { class: "nota", style: "margin-top:8px" }, dec(m.pct_ids) + " % de " + nf.format(m.ids_total) + " identificadores y " + dec(m.pct_com) + " % de " + nf.format(m.com_total) + " comentarios.")),
            h("div", null, ejemplos.length ? [h("h3", null, "Identificadores en español"), h("div", { class: "chips", style: "margin-top:6px" }, ejemplos.map((e) => h("span", { class: "chip" }, e)))] : h("p", { class: "sub" }, "Sin identificadores en español."),
              coms.length ? h("div", { style: "margin-top:10px" }, h("h3", null, "Comentarios en español (muestra)"), h("ul", { class: "nota", style: "margin:6px 0 0; padding-left:18px" }, coms.map((c) => h("li", null, c)))) : null)));
      })));
    return [h("section", { class: "panel" }, h("h2", null, "Informe 7 · " + inf.titulo), h("p", { class: "nota" }, "Penaliza el código escrito en español; el español solo se permite en la información para el usuario. Dimensión: Desempeño (estándar de código). Puntaje de 0 a 100, ordenado de mayor a menor.")), mapa, detalle];

  function renderMetodo() {
    const T = M.totales;
    const tablaPesos = (inf, textos) => h("div", { class: "tbl" }, h("table", { class: "t" }, h("thead", null, h("tr", null, h("th", null, "Componente"), h("th", { class: "n" }, "Máx."), h("th", null, "Cómo se calcula"))),
      h("tbody", null, inf.componentes.map((c) => h("tr", null, h("td", null, c.nombre), h("td", { class: "n" }, c.max), h("td", null, textos[c.id]))))));
    const t1 = {
      cobertura: "15 × (repositorios con al menos un commit válido ÷ 6).",
      puntualidad: "10 × (repositorios cuyo último push fue hasta las 17:00 ÷ 6).",
      granularidad: "25 × (promedio de commits por repositorio − 1) ÷ 3, con tope en 1: se espera trabajo incremental, 4 commits o más por repositorio.",
      constancia: "15 × (franjas de 15 minutos con commits ÷ 8), con tope en 1: subir avances durante la sesión, no todo al final.",

      trazabilidad: "30 × (referencias distintas al spec en lo que escribió ÷ 90), con tope en 1.",
      adaptacion: "15 × (menciones de Laravel, React, Vite, PHP o Artisan ÷ 250), con tope en 1.",
    };
    const t3 = {
      api: "Laravel (3), 21 endpoints del contrato (10), prefijo /api/v1 (2), 6 tablas en singular (4; en plural no cuentan), 15 o más archivos de pruebas automatizadas (4), 16 columnas clave (5), 4 restricciones en la base (4), semilla de 5 categorías (2), 14 códigos de error (4), 4 reglas: 14 días, máximo 3, roles y token de 8 h (4), capas hexagonales (2).",

      tool: "Hay un sembrador (3), siembra por la API (5), sin SQL directo (3), las cantidades de T-21: 40 libros, 10 socios, 15 préstamos y 3 vencidos (4).",

    };
    const t4 = {
      existe: "Hay un index.html a las 17:00.",
      estatico: "No hay llamadas fetch, axios o XMLHttpRequest a la API. Mencionar «/api/v1» en un texto no cuenta como llamada.",
      responsive: "Meta viewport (5), reglas @media o clases responsive (5) y sin desborde horizontal a 375 px (5).",
      producto: "Nombra Manager Library (5) y presenta los 9 conceptos del producto: catálogo, socios, préstamos, devoluciones, vencidos, más prestados, categorías, reglas del préstamo y roles (25).",
      lenguaje: "10 si el texto visible menciona términos de la prueba (T-xx, HU-xx, spec, SDD, ficha, SENA, aprendiz) dos veces o menos; 3 hasta cinco veces; 0 si son más.",
      seguro: "No muestra usuario y contraseña de demostración ni tokens.",
      tecnica: "Idioma declarado, título, un solo h1, imágenes con alt y recursos locales completos (4 cada uno).",
    };
    const t5 = { api: "20 × promedio de T-01 a T-19, con cada tarea elevada al cuadrado: una tarea a medias vale menos de la mitad.", app: "20 × pantallas de T-22 encontradas ÷ 7.", infra: "20 × (compose, PostgreSQL 16, servicio api, servicio app) ÷ 4, según T-20.",
      tool: "20 × (hay sembrador + usa la API + cantidades de T-21) ÷ 3.", page: "20 × (index + estático + responsive) ÷ 3, según T-23." };
    const t6 = { base: "100 × repositorios con producto a las 17:00 ÷ 5. Luego se restan las penalizaciones.", endpoints: "Rutas que no están en el contrato de la API.",
      tablas: "Tablas que no están entre las seis del modelo.", tablas_fw: "Tablas que agrega el framework (sesiones, colas, tokens).",
      columnas: "Columnas que no están en el modelo de su tabla.", auditoria: "created_at/updated_at: §8 decide no llevarlas. Se resta una sola vez.",
      conceptos: "Funciones excluidas por spec.md §2, en el código o en el texto del sitio.", tecnologia: "Otra base de datos, otro framework de frontend o un backend sin PHP.",
      servicios: "Servicios que el spec no pide en compose (redis, nginx, adminer, pgadmin…)." };
    const t7 = { cobertura: "100 × repositorios con código (api, app, tool, page) ÷ 4. Luego se aplican las penalizaciones en proporción.",
      identificadores: "Hasta −70: 70 × (identificadores en español ÷ total) ÷ 2 %. Desde un 2 % se aplica completa.",
      comentarios: "Hasta −30: 30 × (comentarios en español ÷ total) ÷ 25 %." };
    const TEXTOS = { i1: t1, i2: t2, i3: t3, i4: t4, i5: t5, i6: t6, i7: t7 };

        h("p", { class: "nota" }, "Cada informe puntúa de 0 a 100 y el acumulado es la suma (hoy máximo " + nf.format(maxAcum) + "). Los pesos son una propuesta: se pueden cambiar en construir.py y todo se recalcula. Los informes 1 y 2 miden actividad y rastro en el spec; del 3 al 7 se busca en el código y en el sitio, en su estado de las 17:00: hechos del spec (3), calidad del sitio (4), tareas de tasks.md (5), lo que sobra (6) y el idioma del código (7). Ninguno ejecuta el sistema."),
        M.informes.map((i) => [h("h3", null, "Informe " + i.num + " · " + i.corto + " (" + DIM[i.dimension] + ")"), tablaPesos(i, TEXTOS[i.id] || {})])),
      h("section", { class: "panel" }, h("h2", null, "Datos y límites"),
        h("ul", { class: "nota", style: "margin:0; padding-left:18px; display:grid; gap:6px" },
          h("li", null, "Fuente: los forks públicos de los seis repositorios (docs, api, app, page, infra, tool), leídos de GitHub a las " + M.generadoTxt + ". Ventana válida: 10 de octubre de 2026, de 1:15 p. m. a 5:00 p. m., hora de Colombia."),

          h("li", null, "Informes 3 y 4: cada repositorio se evalúa en su último commit hasta las 17:00. Los chequeos buscan texto en el código (rutas, migraciones, nombres de error, variables); una ruta definida de una forma poco común puede no detectarse. Las coincidencias entre aprendices comparan archivos idénticos (api, app) o el contenido línea a línea (page, infra, tool) y se marcan desde el 85 %; no dicen quién copió a quién."),
          h("li", null, "Las capturas del informe 4 se tomaron con Chrome sin ventana, con un perfil temporal, a 1366 y 390 px de ancho."),

      h("section", { class: "panel" }, h("h2", null, "Cómo crece este artifact"),

  }

  // ---------- pestañas ----------
  const RENDER = { pano: renderPano, i1: renderI1, i2: renderI2, i3: renderI3, i4: renderI4, i5: renderI5, i6: renderI6, i7: renderI7, metodo: renderMetodo };
  const TABS = [{ id: "pano", t: "Panorámica" }].concat(M.informes.map((i) => ({ id: i.id, t: "Informe " + i.num + " · " + i.corto }))).concat([{ id: "metodo", t: "Método" }]);
  const cache = {};
  const vista = document.getElementById("vista"), tabs = document.getElementById("tabs");
  function mostrar(id, guardar) {

  mostrar((location.hash || "").slice(1) || "pano", false);
})();
