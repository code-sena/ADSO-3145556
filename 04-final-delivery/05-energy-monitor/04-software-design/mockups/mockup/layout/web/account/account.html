<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnergyMonitor - Mi cuenta</title>
  <meta name="description" content="Consulta y actualiza los datos de tu cuenta: nombre, apellido, correo, contraseña y foto de perfil.">
  <!-- Favicon (versión vector del logo del proyecto) -->
  <link rel="icon" type="image/svg+xml" href="../../../../assets/icons/favicon.svg">
  <!-- Tipografías de la app: Inter (UI) + Poppins (titulares) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/account-styles.css">
</head>
<body>

  <!-- Shell autenticado (MainLayout). En la app es la página sobre la que se
       monta <Account/> en un portal; aquí queda oscurecida por el overlay. -->
  <div class="app-shell">

    <aside class="sidebar">
      <div class="sidebar-top">
        <button class="sidebar-toggle" aria-label="Colapsar menú">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="sidebar-brand">
          <img src="../../../../assets/logos/project_logo.png" alt="EnergyMonitor">
          <span>EnergyMonitor</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="sidebar-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Inicio</span>
        </a>

        <button class="sidebar-item sidebar-group-toggle">
          <span class="toggle-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"></path><path d="M12 12v4"></path><path d="M12 16h.01"></path></svg>
            <span>Hogares</span>
          </span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </button>
        <div class="sidebar-homes">
          <a href="#" class="sidebar-home active"><span class="home-avatar">C</span><span>Casa Principal</span></a>
          <a href="#" class="sidebar-home"><span class="home-avatar">A</span><span>Apartamento 502</span></a>
        </div>

        <a href="#" class="sidebar-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
          <span>Favoritos</span>
        </a>
        <a href="../notifications/notifications.html" class="sidebar-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span>Notificaciones</span>
        </a>
        <a href="#" class="sidebar-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 0-2.83 0 2 2 0 0 0 0 2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a1.65 1.65 0 0 1 1-1.65 1.65 1.65 0 0 1 1.65 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2v.09a1.65 1.65 0 0 1-1.51 1z"></path></svg>
          <span>Ajustes</span>
        </a>
      </nav>

      <!-- Disparador de "Mi cuenta" -->
      <a href="account.html" class="sidebar-profile">
        <div class="profile-avatar">
          <img src="../../../../assets/images/mockup-assets/perfil.png" alt="Foto de perfil">
        </div>
        <div class="profile-info">
          <span class="profile-name">Camila Restrepo</span>
        </div>
        <button class="profile-more" aria-label="Más opciones">⋯</button>
      </a>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <nav class="breadcrumb">
          <a href="#">Inicio</a>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
          <span class="breadcrumb-current">Casa Principal</span>
        </nav>
      </div>

      <div class="shell-placeholder" aria-hidden="true">
        <div class="shell-placeholder-card"></div>
        <div class="shell-placeholder-card"></div>
      </div>
    </main>
  </div>

  <!-- Overlay de "Mi cuenta" (Account.module.css .page, z-index 1000) -->
  <div class="account-overlay">
    <div class="account-wrapper">
      <div class="card">
        <div class="card-content">

          <div class="close-row">
            <!-- Cierra el overlay y devuelve al shell; por eso no apunta a ningún archivo -->
            <button class="close-btn" type="button" aria-label="close">x</button>
          </div>

          <div class="account-inner">
            <h2 class="account-title">Mi cuenta</h2>

            <div class="avatar-wrapper">
              <div class="avatar-container" role="button" tabindex="0" aria-label="Opciones de foto">
                <!-- VscAccount (react-icons/vsc), dibujado como silueta SVG -->
                <svg class="avatar-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a5 5 0 1 0 5 5 5 5 0 0 0-5-5Zm0 8.5A8.5 8.5 0 0 0 3.5 19v1.5a1 1 0 0 0 1 1h15a1 1 0 0 0 1-1V19A8.5 8.5 0 0 0 12 10.5Z"></path></svg>
              </div>

              <!-- Estado "menú de foto abierto" -->
              <ul class="avatar-dropdown" role="menu">
                <li>Agregar foto</li>
                <li>Ver foto</li>
                <li class="is-danger">Eliminar</li>
              </ul>
            </div>

            <div class="account-form">
              <div class="account-row">
                <label class="field-label" for="field-name">Nombre</label>
                <p class="field-value">Camila</p>
                <a href="account-edit.html" class="btn btn-medium btn-primary btn-edit" aria-label="Editar">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                </a>
              </div>

              <div class="account-row">
                <label class="field-label" for="field-lastName">Apellido</label>
                <p class="field-value">Restrepo</p>
                <a href="account-edit.html" class="btn btn-medium btn-primary btn-edit" aria-label="Editar">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                </a>
              </div>

              <!-- El correo nunca es editable: no lleva botón de editar -->
              <div class="account-row">
                <label class="field-label">Correo</label>
                <p class="field-value">camila.restrepo@email.com</p>
              </div>

              <div class="account-row">
                <label class="field-label">Contraseña</label>
                <p class="field-value">••••••••</p>
                <a href="account-password-modal.html" class="btn btn-medium btn-primary btn-edit" aria-label="Editar">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                </a>
              </div>
            </div>

            <div class="delete-section">
              <p class="delete-question">¿Deseas eliminar tu cuenta?</p>
              <a href="account-delete-modal.html" class="btn btn-medium btn-secondary btn-delete">Eliminar cuenta</a>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
