<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnergyMonitor — Registro</title>
  <link rel="icon" type="image/svg+xml" href="../../../../assets/icons/favicon.svg">
  <link rel="stylesheet" href="../css/mobile-shell.css">
  <link rel="stylesheet" href="css/register-styles.css">
</head>
<body>

  <p class="device-caption">EnergyMonitor · <span>/register · RegisterScreen</span></p>

  <div class="phone">

    <!-- Barra de estado (la dibuja el sistema, no la app) -->
    <div class="status-bar on-brand">
      <span>9:41</span>
      <span class="status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true"><path d="M8 9.2 6.2 11a3.2 3.2 0 0 1 3.6 0zM8 5.4c-1.6 0-3 .6-4.1 1.7L2.5 5.7A7.6 7.6 0 0 1 8 3.4c2 0 3.9.8 5.5 2.3l-1.4 1.4A5.6 5.6 0 0 0 8 5.4zM8 .8A11.8 11.8 0 0 0 .5 3.6l1.4 1.4A9.8 9.8 0 0 1 8 2.8c2.6 0 4.9 1 6.7 2.6l1.4-1.4A11.8 11.8 0 0 0 8 .8z"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="1.8" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>
      </span>
    </div>

    <div class="screen">
      <div class="screen-pad">

        <!-- AuthBrandHeader: degradado con el logo y el nombre -->
        <div class="brand-header">
          <div class="brand-row">
            <img class="brand-logo" src="../../../../assets/logos/project_logo.png" alt="EnergyMonitor">
            <span class="brand-name">EnergyMonitor</span>
          </div>
          <!-- authLayout:subtitle -->
          <p class="brand-subtitle">Monitorea tu consumo eléctrico en tiempo real</p>
        </div>

        <!-- RegisterForm -->
        <div class="card card-pad-lg">
          <div class="register-form">

            <!-- auth:register.title -->
            <h1 class="register-title">Registro</h1>

            <!-- Nombre y Apellido van en dos columnas (RegisterForm.styles.ts → nameRow / fieldHalf).
                 Cada columna lleva su propio mensaje de error debajo, con gap xs(4). -->
            <div class="name-row">
              <div class="field-half">
                <div class="input-container">
                  <!-- auth:register.name -->
                  <label class="input-label" for="name">Nombre</label>
                  <div class="input-wrapper">
                    <!-- auth:register.namePlaceholder -->
                    <input class="input" id="name" type="text" placeholder="Tu nombre" autocomplete="name">
                  </div>
                </div>
                <!-- validations:errors.nameMin -->
                <!-- <p class="field-error">Mínimo 2 caracteres</p> -->
              </div>

              <div class="field-half">
                <div class="input-container">
                  <!-- auth:register.lastName -->
                  <label class="input-label" for="lastName">Apellido</label>
                  <div class="input-wrapper">
                    <!-- auth:register.lastNamePlaceholder -->
                    <input class="input" id="lastName" type="text" placeholder="Tu apellido" autocomplete="family-name">
                  </div>
                </div>
                <!-- validations:errors.nameMin -->
                <!-- <p class="field-error">Mínimo 2 caracteres</p> -->
              </div>
            </div>

            <div class="input-container">
              <!-- auth:register.email -->
              <label class="input-label" for="email">Correo electrónico</label>
              <div class="input-wrapper">
                <!-- auth:register.emailPlaceholder -->
                <input class="input" id="email" type="email" placeholder="correo@ejemplo.com" autocomplete="email">
              </div>
            </div>
            <!-- validations:errors.required -->
            <!-- <p class="field-error">El campo es obligatorio</p> -->

            <!-- Cada contraseña tiene su propio interruptor de ojo (dos useState independientes) -->
            <div class="input-container">
              <!-- auth:register.password -->
              <label class="input-label" for="password">Contraseña</label>
              <div class="input-wrapper">
                <input class="input" id="password" type="password" placeholder="••••••">
                <span class="input-icon" aria-label="Mostrar contraseña">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.6 12S5.4 4.8 12 4.8 22.4 12 22.4 12 18.6 19.2 12 19.2 1.6 12 1.6 12Z"></path><circle cx="12" cy="12" r="3.2"></circle></svg>
                </span>
              </div>
            </div>
            <!-- Reglas de passwordField (validations.json), evaluadas en cada tecla:
                 "Mínimo 8 caracteres", "Debe tener una mayúscula",
                 "Debe tener al menos 3 minúsculas", "Debe tener al menos 3 números",
                 "Debe tener un carácter especial", "Máximo 64 caracteres" -->
            <!-- <p class="field-error">Mínimo 8 caracteres</p> -->

            <div class="input-container">
              <!-- auth:register.repeatPassword -->
              <label class="input-label" for="repeatPassword">Repetir contraseña</label>
              <div class="input-wrapper">
                <input class="input" id="repeatPassword" type="password" placeholder="••••••">
                <span class="input-icon" aria-label="Mostrar contraseña">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.6 12S5.4 4.8 12 4.8 22.4 12 22.4 12 18.6 19.2 12 19.2 1.6 12 1.6 12Z"></path><circle cx="12" cy="12" r="3.2"></circle></svg>
                </span>
              </div>
            </div>
            <!-- validations:errors.repeatPassword / validations:errors.passwordMatch -->
            <!-- <p class="field-error">Las contraseñas no coinciden</p> -->

            <!-- Casilla de términos. Estado inicial = desmarcada (defaultValues.terms = false);
                 marcada pasa a .checkbox-checked con el check de Ionicons de 12px. -->
            <div class="terms-row">
              <div class="checkbox" role="checkbox" aria-checked="false" aria-label="Aceptar términos y política de privacidad"></div>
              <!-- auth:register.termsPrefix + terms + termsJoin + privacy (dos enlaces verdes) -->
              <p class="terms-text">Estoy de acuerdo con los <span class="terms-link">Términos de uso</span> y la <span class="terms-link">Política de privacidad</span></p>
            </div>
            <!-- validations:errors.terms -->
            <!-- <p class="field-error">Debes aceptar los términos y condiciones</p> -->

            <!-- Error del servidor (errorMessage): errors:register.emailTaken → "Ya existe una cuenta con este correo." -->
            <!-- <p class="field-error">Ya existe una cuenta con este correo.</p> -->

            <div class="register-buttons">
              <!-- auth:register.submit -->
              <button class="btn btn-primary btn-large btn-full">Registrarse</button>

              <div class="divider">
                <span class="divider-line"></span>
                <!-- auth:register.divider -->
                <span class="divider-text">O</span>
                <span class="divider-line"></span>
              </div>

              <!-- auth:register.registerWith -->
              <p class="login-with">Registrarse usando:</p>

              <!-- auth:register.google — el botón solo registra un console.log en la app -->
              <button class="btn btn-secondary btn-medium btn-full">
                <img class="google-icon" src="../../../../assets/images/mockup-assets/google_icon.png" alt="">
                <span>Google</span>
              </button>
            </div>

            <p class="register">
              <!-- auth:register.haveAccount -->
              ¿Ya tienes una cuenta? <a href="login.html" class="register-link">Inicia sesión</a>
            </p>
          </div>
        </div>

        <!-- LanguageSwitcher variant="light", alineado al centro -->
        <a href="#" class="lang-trigger lang-trigger-light">
          <img class="flag" src="../../../../assets/flags/flag-co.svg" alt="" width="20" height="13">
          <span class="lang-trigger-text lang-text-dark">es-CO</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </a>

      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
</body>
</html>
