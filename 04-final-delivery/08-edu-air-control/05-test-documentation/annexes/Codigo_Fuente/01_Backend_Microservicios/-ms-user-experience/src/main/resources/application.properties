spring.application.name=ms-user-experience

# Puerto canonico segun 09-microservices/service-catalog.md
server.port=${SERVER_PORT:3006}

# ADR-003: una instancia PostgreSQL compartida y un esquema propio por servicio.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/eduaircontrol}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=${DB_CHANGELOG_CONTEXTS:}

# Seguridad: RS256 via JWKS de ms-security (ADR-006) con fallback a HS256 local.
jwt.secret=${JWT_SECRET:}
jwt.jwks-uri=${JWT_JWKS_URI:}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

server.error.include-message=always

# --- Backfill historico ---
# Copia los datos UX del esquema `ux` del monolito al esquema propio. Es
# acoplamiento temporal: una vez copiado, la unica via son los endpoints.
app.backfill.enabled=${BACKFILL_ENABLED:false}
app.backfill.initial-run=${BACKFILL_INITIAL_RUN:false}
