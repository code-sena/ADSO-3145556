services:
  ms-user-experience:
    build: .
    container_name: ms-user-experience
    ports:
      - "${SERVER_PORT:-3006}:3006"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eduaircontrol}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio (min 32 caracteres)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DB_CHANGELOG_CONTEXTS: ${DB_CHANGELOG_CONTEXTS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: always

  postgres:
    image: postgres:15
    container_name: ms-user-experience-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduaircontrol}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    ports:
      - "5434:5432"
    volumes:
      - ms_user_experience_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

volumes:
  ms_user_experience_data:
