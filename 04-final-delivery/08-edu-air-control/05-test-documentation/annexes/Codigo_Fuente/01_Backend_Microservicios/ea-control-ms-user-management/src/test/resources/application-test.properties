spring.datasource.url=jdbc:h2:mem:msusermanagement_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS user_management
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=user_management

spring.liquibase.enabled=false

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Validacion RS256 contra una clave publica generada por TestTokenMint al arrancar
# el test (target/test-keys/). Ninguna clave se versiona y no se necesita red.
security.jwks-uri=
security.rsa.public-key-path=target/test-keys/test-public.pem
