databaseChangeLog:
  - changeSet:
      id: 000-create-schema
      author: eduaircontrol
      comment: "Esquema propio del servicio (ADR-003: un esquema por dominio)."
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE SCHEMA IF NOT EXISTS user_management
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP SCHEMA IF EXISTS user_management CASCADE
