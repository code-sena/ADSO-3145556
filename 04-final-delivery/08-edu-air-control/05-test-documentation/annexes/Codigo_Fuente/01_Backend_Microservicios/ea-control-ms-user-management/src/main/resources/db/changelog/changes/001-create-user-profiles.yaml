databaseChangeLog:
  - changeSet:
      id: 001-create-user-profiles
      author: eduaircontrol
      comment: "Perfiles de usuario; userId referencia por valor a ms-security."
      changes:
        - createTable:
            schemaName: user_management
            tableName: user_profiles
            columns:
              - column:
                  name: profile_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_user_profiles
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(30)
              - column:
                  name: department
                  type: VARCHAR(100)
              - column:
                  name: position
                  type: VARCHAR(100)
              - column:
                  name: locale
                  type: VARCHAR(10)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMPTZ
      rollback:
        - dropTable:
            schemaName: user_management
            tableName: user_profiles
