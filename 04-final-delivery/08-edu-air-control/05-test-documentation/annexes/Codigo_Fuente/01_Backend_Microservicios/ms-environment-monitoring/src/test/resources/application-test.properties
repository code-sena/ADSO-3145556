spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Solo esquema propio: sin semillas de desarrollo.
spring.liquibase.contexts=

jwt.secret=test-only-secret-for-unit-tests-0123456789abcdef
jwt.expiration=86400000

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# El broker no se levanta en los tests de contexto: el consumidor se conecta lazily.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=test
spring.rabbitmq.password=test
app.messaging.measurements-exchange=test.environmental-data
app.messaging.measurements-queue=test.environmental-data.ms-environment-monitoring
# Sin reintentos con espera en los tests: un fallo debe llegar a la DLQ de inmediato.
app.messaging.max-retries=1
app.messaging.initial-retry-interval-ms=100