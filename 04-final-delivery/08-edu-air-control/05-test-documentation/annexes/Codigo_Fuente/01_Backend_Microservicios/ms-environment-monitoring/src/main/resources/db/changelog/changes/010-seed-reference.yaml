databaseChangeLog:

  - changeSet:
      id: 010-seed-catalogs
      author: eduaircontrol
      comment: Estados del analisis y variables ambientales. Siempre aplicable.
      changes:
        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO environment_monitoring.analysis_statuses (analysis_status_id, code, name) VALUES
                ('00000000-0000-4000-8000-000000000041','PENDING','Pendiente'),
                ('00000000-0000-4000-8000-000000000042','RUNNING','En ejecucion'),
                ('00000000-0000-4000-8000-000000000043','COMPLETED','Completado'),
                ('00000000-0000-4000-8000-000000000044','FAILED','Fallido');

              INSERT INTO environment_monitoring.variable
                  (variable_id, code, name, measurement_unit_id, unit_symbol) VALUES
                ('00000000-0000-4000-8000-000000000071','temperature','Temperatura','00000000-0000-4000-8000-000000000001','C'),
                ('00000000-0000-4000-8000-000000000072','humidity','Humedad relativa','00000000-0000-4000-8000-000000000002','%'),
                ('00000000-0000-4000-8000-000000000073','co2','Dioxido de carbono','00000000-0000-4000-8000-000000000003','ppm'),
                ('00000000-0000-4000-8000-000000000074','noise','Ruido','00000000-0000-4000-8000-000000000004','dB');

              -- Severidades de alerta (ADR-014). INFO=1, WARNING=2, CRITICAL=3.
              INSERT INTO environment_monitoring.severity (severity_id, code, name, level) VALUES
                ('00000000-0000-4000-8000-000000000061','INFO','Informativo',1),
                ('00000000-0000-4000-8000-000000000062','WARNING','Advertencia',2),
                ('00000000-0000-4000-8000-000000000063','CRITICAL','Critico',3);

              -- Calidad de medicion (DEC-006). Catalogo local propio.
              INSERT INTO environment_monitoring.quality_flag (quality_flag_id, code, name) VALUES
                ('00000000-0000-4000-8000-000000000065','VALID','Valida'),
                ('00000000-0000-4000-8000-000000000066','SUSPECT','Sospechosa'),
                ('00000000-0000-4000-8000-000000000067','BAD','Invalida');
      rollback:
        - sql:
            dbms: postgresql
              DELETE FROM environment_monitoring.quality_flag
                WHERE quality_flag_id LIKE '00000000-0000-4000-8000-%';
              DELETE FROM environment_monitoring.severity
                WHERE severity_id LIKE '00000000-0000-4000-8000-%';
              DELETE FROM environment_monitoring.variable
                WHERE variable_id LIKE '00000000-0000-4000-8000-%';
              DELETE FROM environment_monitoring.analysis_statuses
                WHERE analysis_status_id LIKE '00000000-0000-4000-8000-%';

  # Umbrales por defecto ADR-014. INFO = rango normal, WARNING = limites externos.
  # CRITICAL se deriva: fuera del rango WARNING. Sin solape por (variable, tipo,
  # severidad). valid_from en el pasado para que esten vigentes al arrancar.
