services:
  ms-environment-monitoring:
    build: .
    container_name: ms-environment-monitoring
    ports:
      - "${SERVER_PORT:-3003}:3003"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eduaircontrol}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME?}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD?}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio (min 32 caracteres)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DB_CHANGELOG_CONTEXTS: ${DB_CHANGELOG_CONTEXTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: always

  postgres:
    image: postgres:15
    container_name: ms-environment-monitoring-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduaircontrol}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    ports:
      - "5433:5432"
    volumes:
      - ms_env_monitoring_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: ms-environment-monitoring-rabbit
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ms_env_monitoring_rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always

volumes:
  ms_env_monitoring_data:
  ms_env_monitoring_rabbit:
