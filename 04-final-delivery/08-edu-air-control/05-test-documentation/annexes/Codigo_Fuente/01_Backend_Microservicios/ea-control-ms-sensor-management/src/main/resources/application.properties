spring.application.name=ms-sensor-management

server.port=${SERVER_PORT:3004}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/eduaircontrol_sensors}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=sensors

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# --- Seguridad (ADR-006): access tokens RS256 emitidos por ms-security ---
# Este servicio no emite tokens: los valida contra el JWKS de ms-security. En tests
# se usa una clave PEM fija (security.rsa.public-key-path) para no depender de red.
security.jwks-uri=${JWKS_URI:http://localhost:8081/api/v1/auth/jwks}
security.rsa.public-key-path=${JWT_PUBLIC_KEY_PATH:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Mensajeria (outbox de instalaciones, ADR-007) ---
# El outbox se escribe en la transaccion de negocio y OutboxRelay lo publica aca.
# Sin estos valores el RabbitTemplate intenta localhost:5672 y la publicacion falla.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME?}
spring.rabbitmq.password=${RABBITMQ_PASSWORD?}

# Exchange topic del dominio sensor. Lo declara esta aplicacion (SensorEventsConfig)
# y lo consume ms-environment-monitoring con el binding sensor.installation.*.
app.sensor.events.exchange=${SENSOR_EVENTS_EXCHANGE:eduaircontrol.sensor}
app.outbox.exchange=${SENSOR_EVENTS_EXCHANGE:eduaircontrol.sensor}

server.error.include-message=always

springdoc.swagger-ui.path=/swagger-ui.html
