spring.datasource.url=jdbc:h2:mem:mssensor_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS sensors
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=sensors

spring.liquibase.enabled=false

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Sin broker en los tests: no se declara la topologia ni se publica nada. La
# publicacion real la prueba ms-environment-monitoring contra RabbitMQ real.
spring.rabbitmq.dynamic=false
# El outbox esta vacio en los tests: evitar el polling del relay.
app.outbox.relay-interval-ms=3600000
app.outbox.health-interval-ms=3600000

# Validacion RS256 contra una clave publica generada por TestTokenMint al arrancar
# el test (target/test-keys/). Ninguna clave se versiona y no se necesita red.
security.jwks-uri=
security.rsa.public-key-path=target/test-keys/test-public.pem
