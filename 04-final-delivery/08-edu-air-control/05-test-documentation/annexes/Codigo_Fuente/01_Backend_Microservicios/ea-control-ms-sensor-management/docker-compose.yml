services:
  ms-sensor-management:
    build: .
    container_name: ms-sensor-management
    ports:
      - "3004:3004"
    environment:
      SERVER_PORT: 3004
      # Access tokens RS256 de ms-security (ADR-006). Con compose por servicio no hay
      # ms-security en la red: se apunta al host. Sobrescriba JWKS_URI si lo hay.
      JWKS_URI: ${JWKS_URI:-http://host.docker.internal:8081/api/v1/auth/jwks}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eduaircontrol_sensors}
      POSTGRES_USER: ${POSTGRES_USER:-sensor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME?}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD?}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  postgres:
    image: postgres:15
    container_name: ms-sensor-management-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduaircontrol_sensors}
      POSTGRES_USER: ${POSTGRES_USER:-sensor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?}
    ports:
      - "5434:5432"
    volumes:
      - sensor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: ms-sensor-management-rabbit
    ports:
      - "5675:5672"
      - "15675:15672"
    volumes:
      - sensor_rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: always

volumes:
  sensor_postgres_data:
  sensor_rabbit_data:
