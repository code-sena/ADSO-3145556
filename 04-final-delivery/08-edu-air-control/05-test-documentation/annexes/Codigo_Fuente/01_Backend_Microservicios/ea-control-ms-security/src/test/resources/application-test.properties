spring.datasource.url=jdbc:h2:mem:mssecurity_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS seguridad\\;SET SCHEMA seguridad
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.connection-init-sql=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:oauth2-schema-h2.sql

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=seguridad

spring.liquibase.enabled=false

jwt.access-token-ttl-seconds=3600
security.rsa.private-key-path=target/test-keys/test-private.pem
security.rsa.public-key-path=target/test-keys/test-public.pem

app.security.lockout-max-attempts=5
app.security.lockout-duration-minutes=15
app.security.refresh-ttl-days=7

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
