databaseChangeLog:
  - changeSet:
      id: 012-create-password-reset-tokens
      author: eduaircontrol
      comment: "Codigos de recuperacion de contrasena (un solo uso)."
      changes:
        - createTable:
            schemaName: seguridad
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_password_reset_tokens
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: code_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: TIMESTAMPTZ
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableSchemaName: seguridad
            baseTableName: password_reset_tokens
            baseColumnNames: user_id
            referencedTableSchemaName: seguridad
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_password_reset_tokens_user
            onDelete: CASCADE
        - createIndex:
            schemaName: seguridad
            tableName: password_reset_tokens
            indexName: idx_password_reset_tokens_user_id
            columns:
              - column:
                  name: user_id
      rollback:
        - dropTable:
            schemaName: seguridad
            tableName: password_reset_tokens
