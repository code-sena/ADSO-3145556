databaseChangeLog:
  - changeSet:
      id: 002-create-roles
      author: eduaircontrol
      comment: "Tabla roles — catálogo ADMIN/USER/VIEWER (sembrado por RoleBootstrap)."
      changes:
        - createTable:
            schemaName: seguridad
            tableName: roles
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_roles
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_roles_name
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            schemaName: seguridad
            tableName: roles
