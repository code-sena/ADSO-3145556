databaseChangeLog:
  - changeSet:
      id: 004-create-refresh-tokens
      author: eduaircontrol
      comment: Tabla refresh_tokens (rotación y revocación; solo hash SHA-256) — data-model.md.
      changes:
        - createTable:
            schemaName: seguridad
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_refresh_tokens
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMPTZ
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: user_agent
                  type: TEXT
      rollback:
        - dropTable:
            schemaName: seguridad
            tableName: refresh_tokens
