spring.application.name=ms-security

server.port=${SERVER_PORT:8081}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5437/eduaircontrol_security}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET search_path TO seguridad, public

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=seguridad

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.liquibase-schema=public

app.oauth2.issuer=${OAUTH2_ISSUER:http://localhost:8081}
app.oauth2.web-redirect-uri=${OAUTH2_WEB_REDIRECT_URI:http://localhost:8080/login/oauth2/code/web}
app.oauth2.mobile-redirect-uri=${OAUTH2_MOBILE_REDIRECT_URI:eduaircontrol://oauth2/callback}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL:3600}
# Un dispositivo no refresca su token: el suyo vive mucho mas que el de un usuario.
jwt.device-token-ttl-seconds=${JWT_DEVICE_TTL:31536000}
security.rsa.private-key-path=${SECURITY_RSA_PRIVATE_KEY_PATH:keys/dev-private.pem}
security.rsa.public-key-path=${SECURITY_RSA_PUBLIC_KEY_PATH:keys/dev-public.pem}

app.security.lockout-max-attempts=${LOCKOUT_MAX_ATTEMPTS:5}
app.security.lockout-duration-minutes=${LOCKOUT_DURATION_MINUTES:15}
app.security.refresh-ttl-days=${REFRESH_TTL_DAYS:7}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Seed único: cuenta SUPER_ADMIN (sus credenciales via SuperAdminBootstrap).
app.superadmin.email=${SUPERADMIN_EMAIL:admin@eduaircontrol.com}
app.superadmin.username=${SUPERADMIN_USERNAME:superadmin}
app.superadmin.password=${SUPERADMIN_PASSWORD:EduAirControl1!}

server.error.include-message=always

springdoc.swagger-ui.path=/swagger-ui.html

# --- Social login (Google, Facebook) ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email


# --- Social login (Google Identity Services) ---
google.client-id=${GOOGLE_CLIENT_ID:}


# --- Social login (Google, Facebook) ---
google.client-secret=${GOOGLE_CLIENT_SECRET:}
facebook.app-id=${FACEBOOK_CLIENT_ID:}
facebook.app-secret=${FACEBOOK_CLIENT_SECRET:}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

