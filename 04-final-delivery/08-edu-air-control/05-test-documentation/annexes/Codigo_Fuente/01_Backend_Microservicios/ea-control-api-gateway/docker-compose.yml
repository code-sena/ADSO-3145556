services:
  api-gateway:
    build: .
    container_name: api-gateway
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_URI: ${AUTH_URI:-http://host.docker.internal:8081}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI:-http://host.docker.internal:8081/api/v1/auth/jwks}
      CLASSROOM_URI: ${CLASSROOM_URI:-http://host.docker.internal:3002}
      SENSOR_URI: ${SENSOR_URI:-http://host.docker.internal:3004}
      MONITORING_URI: ${MONITORING_URI:-http://host.docker.internal:3003}
      USER_MANAGEMENT_URI: ${USER_MANAGEMENT_URI:-http://host.docker.internal:3007}
      USER_EXPERIENCE_URI: ${USER_EXPERIENCE_URI:-http://host.docker.internal:3006}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
    depends_on:
      redis:
        condition: service_started
    restart: always

  redis:
    image: redis:7
    container_name: api-gateway-redis
    ports:
      - "6379:6379"
    restart: always
