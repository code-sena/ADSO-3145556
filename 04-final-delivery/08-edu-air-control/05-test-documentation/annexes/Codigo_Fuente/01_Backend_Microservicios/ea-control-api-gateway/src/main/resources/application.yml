server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    timeout: ${SESSION_TIMEOUT:8h}
  security:
    oauth2:
      client:
        registration:
          web:
            client-id: ${OAUTH2_CLIENT_ID:ea-control-web}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile
            client-authentication-method: none
        provider:
          web:
            authorization-uri: ${AUTH_ISSUER:http://localhost:8081}/oauth2/authorize
            token-uri: ${AUTH_ISSUER:http://localhost:8081}/oauth2/token
            jwk-set-uri: ${AUTH_ISSUER:http://localhost:8081}/oauth2/jwks
            user-info-uri: ${AUTH_ISSUER:http://localhost:8081}/userinfo
            user-name-attribute: sub
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            - id: ms-security
              uri: ${AUTH_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/institutions/**,/api/v1/admin/**,/api/v1/device-tokens/**
            - id: ms-classroom-management
              uri: ${CLASSROOM_URI:http://localhost:3002}
              predicates:
                - Path=/api/v1/educational-environments/**,/api/v1/campuses/**,/api/v1/environment-types/**,/api/v1/classrooms/**
            - id: ms-sensor-management
              uri: ${SENSOR_URI:http://localhost:3004}
              predicates:
                - Path=/api/v1/sensors/**,/api/v1/variables/**,/api/v1/sensor-installations/**,/api/v1/sensor-variables/**,/api/v1/sensor-models/**,/api/v1/sensor-statuses/**,/api/v1/measurement-units/**
            - id: ms-environment-monitoring
              uri: ${MONITORING_URI:http://localhost:3003}
              predicates:
                - Path=/api/v1/environmental-data/**,/api/v1/measurements/**,/api/v1/environments/**,/api/v1/analyses/**,/api/v1/alerts/**,/api/v1/dashboard/**
            - id: ms-user-management
              uri: ${USER_MANAGEMENT_URI:http://localhost:3007}
              predicates:
                - Path=/api/v1/users/**,/api/v1/user-profiles/**
            - id: ms-user-experience
              uri: ${USER_EXPERIENCE_URI:http://localhost:3006}
              predicates:
                - Path=/api/v1/preferences/**,/api/v1/favorites/**,/api/v1/ratings/**,/api/v1/searches/**,/api/v1/classrooms/*/ratings/**

app:
  bff:
    frontend-url: ${BFF_FRONTEND_URL:http://localhost:5173/}
  jwt:
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/api/v1/auth/jwks}
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX:100}
    window-seconds: ${RATE_LIMIT_WINDOW:60}
    exempt-paths:
      - /health
  upstreams:
    ms-security: ${AUTH_URI:http://localhost:8081}
    ms-classroom-management: ${CLASSROOM_URI:http://localhost:3002}
    ms-sensor-management: ${SENSOR_URI:http://localhost:3004}
    ms-environment-monitoring: ${MONITORING_URI:http://localhost:3003}
    ms-user-management: ${USER_MANAGEMENT_URI:http://localhost:3007}
    ms-user-experience: ${USER_EXPERIENCE_URI:http://localhost:3006}
