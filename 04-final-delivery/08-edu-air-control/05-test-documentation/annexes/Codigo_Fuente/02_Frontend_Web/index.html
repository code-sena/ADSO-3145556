<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/shared/assets/EduAirControlLogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EduAirControl: monitoreo y análisis de las condiciones ambientales en espacios educativos."
    />
    <meta name="theme-color" content="#116B78" />
    <title>EduAirControl | Monitoreo ambiental</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #f0fafa;
        z-index: 99999;
        transition: opacity 0.3s ease;
      }
      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #initial-loader .spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid rgba(0, 0, 0, 0.1);
        border-top-color: #01805b;
        animation: spin 0.8s linear infinite;
      }
      #initial-loader .text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        color: #374151;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        #initial-loader { background: #0f172a; }
        #initial-loader .spinner { border-color: rgba(255,255,255,0.1); border-top-color: #01805b; }
        #initial-loader .text { color: #94a3b8; }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="spinner"></div>
      <span class="text">Cargando...</span>
    </div>
    <div id="root"></div>
    <script>
      const loader = document.getElementById('initial-loader');
      const observer = new MutationObserver(() => {
        if (document.getElementById('root').children.length > 0) {
          loader.classList.add('hidden');
          setTimeout(() => loader.remove(), 300);
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
