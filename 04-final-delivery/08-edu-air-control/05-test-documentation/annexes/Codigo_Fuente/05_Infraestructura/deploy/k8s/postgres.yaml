# Tres PostgreSQL independientes (una BD por dominio, ADR-003).
# En producción se recomienda un operador (CloudNativePG/Zalando) o un servicio
# gestionado; aquí se incluye un StatefulSet mínimo como referencia.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-security
  namespace: eduaircontrol
spec:
  serviceName: postgres-security
  replicas: 1
  selector:
    matchLabels:
      app: postgres-security
  template:
    metadata:
      labels:
        app: postgres-security
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: eduaircontrol_security
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: eduaircontrol-secrets
                  key: SECURITY_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eduaircontrol-secrets
                  key: SECURITY_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "security_user"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-security
  namespace: eduaircontrol
spec:
  selector:
    app: postgres-security
  ports:
    - port: 5432
      targetPort: 5432
---
