# Imágenes: sustituye REGISTRY/TAG por tu registro real (GHCR, ECR, ...).
#   REGISTRY=ghcr.io/eduaircontrol  TAG=1.0.0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: eduaircontrol
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/eduaircontrol/ea-control-api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: eduaircontrol-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: eduaircontrol
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-security
  namespace: eduaircontrol
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-security
  template:
    metadata:
      labels:
        app: ms-security
    spec:
      containers:
        - name: ms-security
          image: ghcr.io/eduaircontrol/ea-control-ms-security:latest
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: POSTGRES_URL
              value: jdbc:postgresql://postgres-security:5432/eduaircontrol_security
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: eduaircontrol-secrets
                  key: SECURITY_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eduaircontrol-secrets
                  key: SECURITY_PASSWORD
            - name: SECURITY_RSA_PRIVATE_KEY_PATH
              value: /app/keys/dev-private.pem
            - name: SECURITY_RSA_PUBLIC_KEY_PATH
              value: /app/keys/dev-public.pem
          envFrom:
            - configMapRef:
                name: eduaircontrol-config
          volumeMounts:
            - name: rsa-keys
              mountPath: /app/keys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/auth/health
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/auth/health
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: rsa-keys
          secret:
            secretName: eduaircontrol-secrets
            items:
              - key: dev-private.pem
                path: dev-private.pem
              - key: dev-public.pem
                path: dev-public.pem
---
apiVersion: v1
kind: Service
metadata:
  name: ms-security
  namespace: eduaircontrol
spec:
  selector:
    app: ms-security
  ports:
    - port: 8081
      targetPort: 8081
---
