global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Los servicios deben exponer /actuator/prometheus
  # (spring-boot-starter-actuator + micrometer-registry-prometheus).
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: ms-security
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ms-security:8081"]

  - job_name: ms-classroom-management
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ms-classroom-management:3002"]

  - job_name: ms-sensor-management
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ms-sensor-management:3004"]
