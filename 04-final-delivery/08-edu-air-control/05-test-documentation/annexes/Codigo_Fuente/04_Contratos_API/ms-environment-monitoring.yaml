openapi: 3.0.3
info:
  title: ms-environment-monitoring API
  version: 1.0.0
  description: |
    Recolecci├│n y an├ílisis de datos ambientales: ingesta de mediciones, snapshots y
    an├ílisis hist├│rico por periodo (d├¡a, semana, mes, a├▒o).

    ## Alcance
    Este servicio es due├▒o de las mediciones ambientales (`environment_measurement`),
    de la evaluaci├│n de umbrales y de los an├ílisis hist├│ricos materializados
    (`environmental_analysis` + `analysis_result`). No es due├▒o de ambientes, variables
    ni sensores: los referencia por UUID y los resuelve por API.

    ## An├ílisis hist├│rico
    Un an├ílisis materializa el periodo analizado y produce un resultado agregado por
    variable (m├¡nimo, m├íximo, promedio, cantidad de muestras y excedencias). El c├ílculo
    se ejecuta de forma s├¡ncrona: la solicitud se persiste en `PENDING`, pasa a
    `RUNNING` y termina en `COMPLETED` o `FAILED`, por lo que la respuesta ya incluye
    los resultados. Las mediciones crudas siguen siendo la fuente de verdad.

    ## Estados del an├ílisis
    | Estado      | Significado                                        |
    |-------------|----------------------------------------------------|
    | `PENDING`   | Solicitado, a├║n sin procesar                       |
    | `RUNNING`   | En proceso de agregaci├│n                           |
    | `COMPLETED` | Agregaci├│n finalizada; hay `analysis_result`        |
    | `FAILED`    | La agregaci├│n fall├│; no produce resultados          |

servers:
  - url: http://localhost:3003
    description: Local development
  - url: https://api.dev.{domain}/api/v1
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}/api/v1
    description: Production
    variables:
      domain:
        default: example.com

tags:
  - name: Analysis
    description: An├ílisis hist├│rico de datos ambientales por periodo
  - name: Dashboard
    description: Indicadores y series para el dashboard ambiental

paths:
  /analyses:
    post:
      summary: Solicitar el an├ílisis de un ambiente en un periodo
      operationId: requestAnalysis
      tags: [Analysis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
            example:
              environmentId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
              period: WEEK
              referenceDate: '2026-09-04'
      responses:
        '201':
          description: An├ílisis creado y procesado
          headers:
            Location:
              description: URI del an├ílisis creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ya existe un an├ílisis para el mismo ambiente y periodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Listar an├ílisis hist├│ricos
      operationId: listAnalyses
      tags: [Analysis]
      parameters:
        - name: environmentId
          in: query
          description: Filtra por ambiente educativo
          schema:
            $ref: '#/components/schemas/UUID'
        - name: period
          in: query
          description: Filtra por granularidad del periodo
          schema:
            $ref: '#/components/schemas/AnalysisPeriod'
        - name: status
          in: query
          description: Filtra por estado del an├ílisis
          schema:
            $ref: '#/components/schemas/AnalysisStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: P├ígina de an├ílisis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analyses/latest:
    get:
      summary: Ultimo analisis completado de un ambiente para un periodo
      operationId: getLatestAnalysis
      tags: [Analysis]
      parameters:
        - name: environmentId
          in: query
          required: true
          description: Ambiente educativo
          schema:
            $ref: '#/components/schemas/UUID'
        - name: period
          in: query
          description: Granularidad del periodo
          schema:
            $ref: '#/components/schemas/AnalysisPeriod'
        - name: referenceDate
          in: query
          description: Ancla del periodo en formato YYYY-MM-DD (UTC)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Ultimo analisis completado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
        '204':
          description: No hay analisis completado para el periodo
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analyses/{id}:
    get:
      summary: Obtener un an├ílisis con sus resultados por variable
      operationId: getAnalysis
      tags: [Analysis]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: An├ílisis encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /measurements:
    post:
      summary: Ingesta HTTP alternativa a MQTT (HU-MON-001)
      operationId: ingestMeasurement
      tags: [Measurements]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementIngest'
      responses:
        '201':
          description: Medicion registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    $ref: '#/components/schemas/UUID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /environments/{id}/current:
    get:
      summary: Ultimos valores por variable de un ambiente (HU-MON-003)
      operationId: getCurrentValues
      tags: [Measurements]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Valores actuales por variable
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurrentValue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /environments/{id}/measurements:
    get:
      summary: Historial paginado por variable y ventana (HU-MON-004)
      operationId: listMeasurements
      tags: [Measurements]
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: variable
          in: query
          schema:
            $ref: '#/components/schemas/UUID'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Mediciones del periodo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeasurementView'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /alerts:
    get:
      summary: Listar alertas con filtros
      operationId: listAlerts
      tags: [Alerts]
      parameters:
        - name: environment
          in: query
          schema:
            $ref: '#/components/schemas/UUID'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, acknowledged]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Alertas filtradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertView'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /alerts/{id}/acknowledge:
    post:
      summary: Reconocer una alerta activa
      operationId: acknowledgeAlert
      tags: [Alerts]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Alerta reconocida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La alerta ya fue reconocida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dashboard/summary:
    get:
      summary: Indicadores globales del dashboard ambiental
      operationId: getDashboardSummary
      tags: [Dashboard]
      responses:
        '200':
          description: Resumen de conteos y promedios
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    properties:
                      environments:
                        type: integer
                      measurements:
                        type: integer
                      analyses:
                        type: integer
                  averages:
                    type: object
                    additionalProperties:
                      type: number
                  lastUpdated:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/series:
    get:
      summary: Serie hist├│rica agregada del dashboard
      operationId: getDashboardSeries
      tags: [Dashboard]
      parameters:
        - name: period
          in: query
          description: Granularidad de la serie
          schema:
            type: string
            enum: [day, week, month, year]
            default: day
        - name: variable
          in: query
          description: Variable ambiental
          schema:
            type: string
            default: temperature
        - name: environmentId
          in: query
          description: Restringe la serie a un ambiente
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Puntos de la serie
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeriesPoint'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  schemas:
    AnalysisRequest:
      type: object
      required: [environmentId, period]
      properties:
        environmentId:
          $ref: '#/components/schemas/UUID'
        period:
          $ref: '#/components/schemas/AnalysisPeriod'
        referenceDate:
          type: string
          format: date
          description: |
            Ancla del periodo en formato `YYYY-MM-DD`. Si se omite se usa la fecha actual.
            El periodo se resuelve en UTC.

    AnalysisResponse:
      type: object
      required: [id, environmentId, period, periodStart, periodEnd, status, results]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        environmentId:
          $ref: '#/components/schemas/UUID'
        period:
          $ref: '#/components/schemas/AnalysisPeriod'
        periodStart:
          $ref: '#/components/schemas/Timestamp'
        periodEnd:
          $ref: '#/components/schemas/Timestamp'
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        requestedBy:
          $ref: '#/components/schemas/UUID'
        computedAt:
          $ref: '#/components/schemas/Timestamp'
        results:
          type: array
          description: Resultado agregado por variable
          items:
            $ref: '#/components/schemas/AnalysisResult'

    AnalysisResult:
      type: object
      required: [variableId, variableCode, minValue, maxValue, avgValue, sampleCount, exceedanceCount]
      properties:
        variableId:
          $ref: '#/components/schemas/UUID'
        variableCode:
          type: string
          description: C├│digo de la variable (TEMP, HUM, CO2, NOISE)
          example: TEMP
        minValue:
          type: number
        maxValue:
          type: number
        avgValue:
          type: number
        sampleCount:
          type: integer
          description: Cantidad de mediciones agregadas
        exceedanceCount:
          type: integer
          description: Muestras fuera del umbral de advertencia vigente

    AnalysisPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisResponse'
        meta:
          $ref: '#/components/schemas/PaginatedMeta'

    AnalysisPeriod:
      type: string
      description: Granularidad del periodo analizado
      enum: [DAY, WEEK, MONTH, YEAR]

    AnalysisStatus:
      type: string
      description: Estado del ciclo de vida del an├ílisis
      enum: [PENDING, RUNNING, COMPLETED, FAILED]

    SeriesPoint:
      type: object
      required: [bucket, value, samples]
      properties:
        bucket:
          $ref: '#/components/schemas/Timestamp'
        value:
          type: number
        samples:
          type: integer

    MeasurementIngest:
      type: object
      required: [sensorInstallationId, variableId, value]
      properties:
        sensorInstallationId:
          $ref: '#/components/schemas/UUID'
        variableId:
          $ref: '#/components/schemas/UUID'
        value:
          type: number
        measuredAt:
          $ref: '#/components/schemas/Timestamp'

    CurrentValue:
      type: object
      required: [variableId, variableCode, value, measuredAt]
      properties:
        variableId:
          $ref: '#/components/schemas/UUID'
        variableCode:
          type: string
        value:
          type: number
        measuredAt:
          $ref: '#/components/schemas/Timestamp'

    MeasurementView:
      type: object
      required: [id, variableId, variableCode, value, measuredAt]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        variableId:
          $ref: '#/components/schemas/UUID'
        variableCode:
          type: string
        value:
          type: number
        measuredAt:
          $ref: '#/components/schemas/Timestamp'

    AlertView:
      type: object
      required: [id, environmentId, variableId, variableCode, raisedAt]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        environmentId:
          $ref: '#/components/schemas/UUID'
        variableId:
          $ref: '#/components/schemas/UUID'
        variableCode:
          type: string
        severityCode:
          type: string
        triggeringValue:
          type: number
        raisedAt:
          $ref: '#/components/schemas/Timestamp'
        acknowledgedAt:
          $ref: '#/components/schemas/Timestamp'
        acknowledgedBy:
          $ref: '#/components/schemas/UUID'

    UUID:
      type: string
      format: uuid

    Timestamp:
      type: string
      format: date-time

    PaginatedMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        traceId:
          type: string

  parameters:
    PageParam:
      $ref: './_shared.yaml#/components/parameters/PageParam'

    LimitParam:
      $ref: './_shared.yaml#/components/parameters/LimitParam'

    IdParam:
      $ref: './_shared.yaml#/components/parameters/IdParam'

  responses:
    BadRequest:
      $ref: './_shared.yaml#/components/responses/BadRequest'

    Unauthorized:
      $ref: './_shared.yaml#/components/responses/Unauthorized'

    Forbidden:
      $ref: './_shared.yaml#/components/responses/Forbidden'

    NotFound:
      $ref: './_shared.yaml#/components/responses/NotFound'

security:
  - bearerAuth: []
