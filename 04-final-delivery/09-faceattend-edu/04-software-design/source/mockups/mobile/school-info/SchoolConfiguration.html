<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceAttendEDU - School Info</title>
    <style>
        :root {
            --color-primary: #2196F3;
            --color-bg-page: #F8FAFC;
            --color-bg-card: #FFFFFF;
            --color-text-primary: #0F172A;
            --color-text-secondary: #64748B;
            --space-md: 16px;
            --space-lg: 24px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
        }
        body {
            font-family: sans-serif;
            background-color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .mobile-viewport {
            width: 375px;
            height: 812px;
            background-color: var(--color-bg-page);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            border: 8px solid #334155;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 40px var(--space-lg) var(--space-md);
            background-color: var(--color-bg-card);
            border-bottom: 1px solid #e2e8f0;
        }
        .header h1 {
            font-size: 22px;
            color: var(--color-text-primary);
            margin: 0;
        }
        .content {
            padding: var(--space-lg);
            flex: 1;
            overflow-y: auto;
        }
        .summary-card {
            background: var(--color-bg-card);
            padding: var(--space-md);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            text-align: center;
            margin-bottom: var(--space-lg);
        }
        .summary-card img {
            width: 60px;
            height: 60px;
            background: #e2e8f0;
            border-radius: 50%;
            margin-bottom: var(--space-md);
        }
        .summary-card h3 {
            margin: 0 0 8px 0;
            color: var(--color-text-primary);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: var(--space-md);
        }
        .stat-item {
            background: #f1f5f9;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            display: block;
            font-weight: bold;
            color: var(--color-primary);
            font-size: 16px;
        }
        .stat-label {
            font-size: 10px;
            color: var(--color-text-secondary);
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: var(--space-lg);
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: #e2e8f0;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .tab.active {
            background: var(--color-primary);
            color: white;
        }
        .form-group {
            margin-bottom: var(--space-md);
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--color-text-secondary);
            margin-bottom: 4px;
        }
        .input-field {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .footer {
            padding: var(--space-lg);
            background-color: var(--color-bg-card);
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
        }
        .btn {
            flex: 1;
            text-align: center;
            padding: 14px;
            border-radius: var(--radius-lg);
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        .btn-primary { background-color: var(--color-primary); color: white; }
        .btn-secondary { background-color: #e2e8f0; color: var(--color-text-primary); }
    </style>
</head>
<body>
    <div class="mobile-viewport">
        <div class="header">
            <h1>Configuración Escolar</h1>
        </div>
        <div class="content">
            <div class="summary-card">
                <img src="https://via.placeholder.com/60" alt="Logo">
                <h3>Universidad FaceAttendEDU</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-value">1,200</span>
                        <span class="stat-label">Estudiantes</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value">45</span>
                        <span class="stat-label">Profesores</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value">120</span>
                        <span class="stat-label">Cursos</span>
                    </div>
                </div>
            </div>
            <div class="tabs">
                <div class="tab active">General</div>
                <div class="tab">Contacto</div>
                <div class="tab">Académico</div>
            </div>
            <div class="form-group">
                <label>Nombre de la Institución</label>
                <input type="text" class="input-field" value="Universidad FaceAttendEDU">
            </div>
            <div class="form-group">
                <label>Código Institucional</label>
                <input type="text" class="input-field" value="EDU-UNI-001">
            </div>
            <div class="form-group">
                <label>Distrito</label>
                <input type="text" class="input-field" value="San José Centro">
            </div>
        </div>
        <div class="footer">
            <button class="btn btn-secondary">Descartar</button>
            <button class="btn btn-primary">Guardar Cambios</button>
        </div>
    </div>
</body>
</html>
