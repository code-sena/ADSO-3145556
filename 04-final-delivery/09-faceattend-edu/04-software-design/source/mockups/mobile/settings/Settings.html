<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceAttendEDU - Settings</title>
    <style>
        :root {
            --color-primary: #2196F3;
            --color-bg-page: #F8FAFC;
            --color-bg-card: #FFFFFF;
            --color-text-primary: #0F172A;
            --color-text-secondary: #64748B;
            --space-md: 16px;
            --space-lg: 24px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
        }
        body {
            font-family: sans-serif;
            background-color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .mobile-viewport {
            width: 375px;
            height: 812px;
            background-color: var(--color-bg-page);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            border: 8px solid #334155;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 40px var(--space-lg) var(--space-md);
            background-color: var(--color-bg-card);
            border-bottom: 1px solid #e2e8f0;
        }
        .header h1 {
            font-size: 22px;
            color: var(--color-text-primary);
            margin: 0;
        }
        .content {
            padding: var(--space-lg);
            flex: 1;
            overflow-y: auto;
        }
        .setting-section {
            margin-bottom: var(--space-lg);
        }
        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            margin-bottom: 12px;
            display: block;
        }
        .language-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: var(--space-lg);
        }
        .lang-item {
            background: var(--color-bg-card);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e2e8f0;
            cursor: pointer;
        }
        .lang-item.active {
            border-color: var(--color-primary);
            background: #eff6ff;
        }
        .lang-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--color-text-primary);
        }
        .nav-card {
            background: var(--color-bg-card);
            padding: var(--space-md);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--color-text-primary);
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
        }
        .nav-card span {
            font-size: 15px;
            font-weight: 500;
        }
        .footer {
            padding: var(--space-lg);
            background-color: var(--color-bg-card);
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
        }
        .btn {
            flex: 1;
            text-align: center;
            padding: 14px;
            border-radius: var(--radius-lg);
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        .btn-primary { background-color: var(--color-primary); color: white; }
        .btn-secondary { background-color: #e2e8f0; color: var(--color-text-primary); }
    </style>
</head>
<body>
    <div class="mobile-viewport">
        <div class="header">
            <h1>Ajustes</h1>
        </div>
        <div class="content">
            <div class="setting-section">
                <span class="section-title">Idioma de la App</span>
                <div class="language-list">
                    <div class="lang-item active">
                        <div class="lang-info"><span>🇪🇸 Español</span></div>
                        <span style="color: var(--color-primary)">✓</span>
                    </div>
                    <div class="lang-item">
                        <div class="lang-info"><span>🇺🇸 Inglés</span></div>
                    </div>
                    <div class="lang-item">
                        <div class="lang-info"><span>🇫🇷 Francés</span></div>
                    </div>
                </div>
            </div>
            <div class="setting-section">
                <span class="section-title">Personalización</span>
                <a href="#" class="nav-card">
                    <span>Apariencia y Temas</span>
                    <span style="color: var(--color-text-secondary)">→</span>
                </a>
                <a href="#" class="nav-card">
                    <span>Configurar Alertas</span>
                    <span style="color: var(--color-text-secondary)">→</span>
                </a>
            </div>
        </div>
        <div class="footer">
            <button class="btn btn-secondary">Cancelar</button>
            <button class="btn btn-primary">Guardar</button>
        </div>
    </div>
</body>
</html>
