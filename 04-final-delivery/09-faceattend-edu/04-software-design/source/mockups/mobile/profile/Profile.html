<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceAttendEDU - Profile</title>
    <style>
        :root {
            --color-primary: #2196F3;
            --color-bg-page: #F8FAFC;
            --color-bg-card: #FFFFFF;
            --color-text-primary: #0F172A;
            --color-text-secondary: #64748B;
            --space-md: 16px;
            --space-lg: 24px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
        }
        body {
            font-family: sans-serif;
            background-color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .mobile-viewport {
            width: 375px;
            height: 812px;
            background-color: var(--color-bg-page);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            border: 8px solid #334155;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 40px var(--space-lg) var(--space-md);
            text-align: center;
            background-color: var(--color-bg-card);
        }
        .profile-img {
            width: 100px;
            height: 100px;
            background: #e2e8f0;
            border-radius: 50%;
            margin: 0 auto var(--space-md);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: var(--color-text-secondary);
        }
        .profile-name {
            font-size: 22px;
            font-weight: bold;
            color: var(--color-text-primary);
            margin-bottom: 4px;
        }
        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #dbeafe;
            color: var(--color-primary);
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
        }
        .content {
            padding: var(--space-lg);
            flex: 1;
            overflow-y: auto;
        }
        .info-section {
            background: var(--color-bg-card);
            padding: var(--space-md);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--space-lg);
        }
        .info-section h3 {
            font-size: 16px;
            color: var(--color-text-primary);
            margin: 0 0 12px 0;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .info-label {
            font-size: 13px;
            color: var(--color-text-secondary);
        }
        .info-value {
            font-size: 13px;
            color: var(--color-text-primary);
            font-weight: 500;
        }
        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: var(--space-lg);
        }
        .btn-outline {
            padding: 12px;
            border: 1px solid var(--color-primary);
            color: var(--color-primary);
            border-radius: var(--radius-lg);
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-outline:hover { background: #eff6ff; }
        .footer {
            padding: var(--space-lg);
            background-color: var(--color-bg-card);
            border-top: 1px solid #e2e8f0;
        }
        .btn-primary {
            background-color: var(--color-primary);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: var(--radius-lg);
            text-decoration: none;
            display: block;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="mobile-viewport">
        <div class="header">
            <div class="profile-img">FOTO</div>
            <div class="profile-name">Juan Pérez</div>
            <div class="role-badge">Estudiante</div>
        </div>
        <div class="content">
            <div class="info-section">
                <h3>Información Personal</h3>
                <div class="info-row">
                    <span class="info-label">Email:</span>
                    <span class="info-value">juan.perez@email.com</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Teléfono:</span>
                    <span class="info-value">+506 8888-8888</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Código:</span>
                    <span class="info-value">EDU-2023-001</span>
                </div>
            </div>
            <div class="info-section">
                <h3>Mi Progreso</h3>
                <div class="info-row">
                    <span class="info-label">Asistencias:</span>
                    <span class="info-value">92%</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Cursos:</span>
                    <span class="info-value">5 Activos</span>
                </div>
            </div>
            <div class="quick-actions">
                <a href="#" class="btn-outline">Actualizar Perfil</a>
                <a href="#" class="btn-outline">Actualizar Contraseña</a>
                <a href="#" class="btn-outline">Cambiar Tema de App</a>
            </div>
        </div>
        <div class="footer">
            <a href="#" class="btn-primary">Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
