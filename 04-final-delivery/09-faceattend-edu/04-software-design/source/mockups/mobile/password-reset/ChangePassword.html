<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Cambiar contraseña</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#0284c7',
              primary: '#007aff',
              btn: '#0d87ea'
            }
          },
          borderRadius: {
            'modal': '28px',
            'input': '12px'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Helvetica Neue', 'Arial', 'sans-serif']
          }
        }
      }
    };
  </script>
<style data-purpose="custom-styling">
    /* iOS modal specific overlay styling */
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body class="bg-[#181a1b] min-h-screen flex items-center justify-center font-sans antialiased select-none p-0 m-0">
<!-- BEGIN: MobileDeviceFrame -->
<main class="relative w-full max-w-[430px] h-[932px] max-h-screen overflow-hidden bg-[#121314] flex flex-col justify-between shadow-2xl" data-purpose="mobile-container">
<!-- BEGIN: iOSStatusBar -->

<!-- END: iOSStatusBar -->
<!-- BEGIN: BackgroundBlurredContent -->
<!-- Dimmed content that sits behind the modal dialog -->
<div class="absolute inset-0 px-6 pt-16 flex flex-col pointer-events-none opacity-80" data-purpose="background-underlay">
<!-- Top button 'Administrador' -->
<div class="flex justify-center mt-2">
<div class="border border-white/20 rounded-full px-7 py-1.5 bg-white/5">
<span class="text-white text-base font-medium tracking-wide">Administrador</span>
</div>
</div>
<!-- Section indicator and title -->
<div class="mt-14 flex items-center space-x-2">
<div class="w-1 h-5 bg-[#007aff] rounded-sm"></div>
<h2 class="text-white text-lg font-bold">Información Personal</h2>
</div>
<!-- Bottom dark button 'Volver' placeholder -->
<div class="mt-auto mb-10 w-full">
<div class="w-full bg-[#071727] py-3.5 rounded-xl border border-white/10 flex items-center justify-center">
<span class="text-[#3b82f6] text-base font-semibold">Volver</span>
</div>
</div>
</div>
<!-- END: BackgroundBlurredContent -->
<!-- Backdrop Dimming Layer -->
<div class="absolute inset-0 bg-black/40 z-20 pointer-events-auto" data-purpose="modal-overlay"></div>
<!-- BEGIN: ChangePasswordModal -->
<section class="relative z-30 mx-4 my-auto bg-white rounded-modal shadow-2xl p-6 pt-7 pb-6 flex flex-col" data-purpose="modal-dialog">
<!-- Header section -->
<header class="text-center mb-6">
<h1 class="text-[21px] font-bold text-[#111827] tracking-tight mb-1">Cambiar contraseña</h1>
<p class="text-[#4b5563] text-sm">Usa al menos 8 caracteres</p>
</header>
<!-- Password form -->
<form action="#" class="space-y-4" data-purpose="password-form" method="POST" onsubmit="event.preventDefault();">
<!-- Field 1: Current Password -->
<div class="space-y-2">
<label class="block text-sm font-bold text-[#1f2937]" for="current-password">
            Ingrese su contraseña actual
          </label>
<input class="w-full px-4 py-3 bg-[#f8f9fa] border border-[#e2e8f0] rounded-input text-[#334155] placeholder-[#64748b] text-[15px] focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all shadow-sm" id="current-password" name="current_password" placeholder="Contraseña actual" type="password">
</div>
<!-- Field 2: New Password -->
<div class="space-y-2">
<label class="block text-sm font-bold text-[#1f2937]" for="new-password">
            Ingrese su nueva contraseña
          </label>
<input class="w-full px-4 py-3 bg-[#f8f9fa] border border-[#e2e8f0] rounded-input text-[#334155] placeholder-[#64748b] text-[15px] focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all shadow-sm" id="new-password" name="new_password" placeholder="Nueva contraseña" type="password">
</div>
<!-- Field 3: Confirm Password -->
<div class="space-y-2">
<label class="block text-sm font-bold text-[#1f2937]" for="confirm-password">
            Confirme la contraseña ingresada
          </label>
<input class="w-full px-4 py-3 bg-[#f8f9fa] border border-[#e2e8f0] rounded-input text-[#334155] placeholder-[#64748b] text-[15px] focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all shadow-sm" id="confirm-password" name="confirm_password" placeholder="Confirmar contraseña" type="password">
</div>
<!-- Actions -->
<div class="pt-3 flex flex-col items-center space-y-4">
<!-- Primary submit button -->
<button class="w-full py-3.5 bg-[#0082f4] hover:bg-[#0072d6] active:bg-[#0060b8] text-white font-semibold text-[16px] rounded-xl shadow-md transition-colors text-center cursor-pointer" data-purpose="submit-button" type="submit">
            Guardar contraseña
          </button>
<!-- Cancel link button -->
<button class="text-[#0082f4] hover:text-[#0068c4] active:opacity-75 font-medium text-[15px] cursor-pointer py-1 transition-colors" data-purpose="cancel-button" type="button">
            Cancelar
          </button>
</div>
</form>
</section>
<!-- END: ChangePasswordModal -->
<!-- Empty footer space to align with iOS layout proportions -->
<footer class="h-6 w-full z-10" data-purpose="ios-home-indicator-spacer"></footer>
</main>
<!-- END: MobileDeviceFrame -->


</body></html>
