<!DOCTYPE html><html lang="es" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Registro de rostro</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'capture-green': '#00b574',
            'action-blue': '#1274d8',
            'navy-heading': '#172b4d',
            'instruction-gray': '#505f79',
            'scanner-bg': '#8f8880'
          }
        }
      }
    };
  </script>
<style data-purpose="custom-layout">
    /* Asegurar proporciones idénticas de aspecto móvil en vista de prueba */
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body class="bg-white text-slate-800 min-h-screen flex justify-center items-center select-none">
<!-- BEGIN: MobileDeviceFrame -->
<main class="w-full max-w-md min-h-screen bg-white flex flex-col justify-between px-6 py-8 sm:py-10 shadow-lg relative">
<!-- BEGIN: HeaderSection -->
<header class="w-full flex items-center justify-between gap-4 pt-1 pb-1"><!-- Título de la pantalla -->
<h1 class="text-xl sm:text-2xl font-black text-navy-heading tracking-tight whitespace-nowrap leading-none">
  Registro de rostro
</h1>
<!-- Contenedor del logotipo de la app -->
<div class="w-36 h-36 sm:w-40 sm:h-40 rounded-full flex-shrink-0 flex items-center justify-center p-0.5 shadow-sm ml-auto" data-purpose="app-logo-wrapper">
  <img alt="Logotipo oficial" class="w-full h-full object-contain rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDPVOYd9BK0i5zkSrJH3dvRmoWNMjrAa-S8525dpaMMtVqraWtecPTcbbTpB_01GdI4qIHxxhMC9mh2oFrpjpigCMc9i-rsc1UvVHas6Q8v0JYAMt52lshczAVtLYTfQjsRRwRzqfb3l2Y32HQgGXMpMAXWQJwMtnBV0OVa4TIzLCZ3HqQNaP2DapN0FCIYZOBgAGdlI_zhcmO9l-et5KUW93xlwXqVzVSX7SnEKPnTKQZboKC-JHhjC7byyab_HRMxWA">
</div></header>
<!-- END: HeaderSection -->
<!-- BEGIN: InstructionSection -->
<section aria-label="Instrucciones" class="mt-4 px-2 text-center">
<p class="text-sm sm:text-base font-medium text-instruction-gray leading-snug">
        Coloca tu rostro dentro del óvalo y presiona el botón cuando estés acomodado.
      </p>
</section>
<!-- END: InstructionSection -->
<!-- BEGIN: CameraScannerArea -->
<section aria-label="Visor de la cámara" class="w-full my-6 flex-1 flex items-center justify-center">
<!-- Visor con bordes redondeados y fondo gris neutro representativo de cámara -->
<div class="relative w-full aspect-[4/5] max-h-[460px] bg-scanner-bg rounded-3xl overflow-hidden flex items-center justify-center shadow-inner">
<!-- Guía ovalada vertical para centrar el rostro -->
<div class="w-[74%] h-[82%] border-2 border-white/95 rounded-[50%]" data-purpose="face-oval-guide" style="aspect-ratio: 1 / 1.5;">
</div>
</div>
</section>
<!-- END: CameraScannerArea -->
<!-- BEGIN: ActionButtonsGroup -->
<footer class="w-full flex flex-col gap-3.5 pb-2">
<!-- Botón principal: Capturar rostro -->
<button class="w-full py-4 px-6 bg-capture-green hover:bg-emerald-600 active:scale-[0.99] transition-all text-white font-bold text-base sm:text-lg rounded-2xl shadow-sm text-center" data-purpose="capture-button" type="button">
        Capturar rostro
      </button>
<!-- Botón secundario: Volver -->
<button class="w-full py-4 px-6 bg-action-blue hover:bg-blue-600 active:scale-[0.99] transition-all text-white font-bold text-base sm:text-lg rounded-2xl shadow-sm text-center" data-purpose="back-button" type="button">
        Volver
      </button>
</footer>
<!-- END: ActionButtonsGroup -->
</main>
<!-- END: MobileDeviceFrame -->






</body></html>
