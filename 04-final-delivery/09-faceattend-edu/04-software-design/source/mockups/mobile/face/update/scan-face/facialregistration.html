<!-- Custom Styles for Precise Camera Overlay -->
<style data-purpose="custom-styling">
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Background tone mimicking natural indoor camera feed */
    .camera-background {
      background: radial-gradient(circle at 50% 38%, #a09c95 0%, #8c8880 60%, #7d7972 100%);
    }

    /* Subdued title drop shadow for high contrast over light camera feeds */
    .title-shadow {
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
    }
    
    /* Shutter button ring gap */
    .shutter-outer-ring {
      box-shadow: 0 0 0 3.5px #ffffff, inset 0 0 0 3px transparent;
    }
  </style>
</head>
