<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceAttendEDU - Justification Results</title>
    <style>
        :root {
            --color-primary: #2196F3;
            --color-bg-page: #F8FAFC;
            --color-bg-card: #FFFFFF;
            --color-text-primary: #0F172A;
            --color-text-secondary: #64748B;
            --color-success: #10B981;
            --color-error: #EF4444;
            --space-md: 16px;
            --space-lg: 24px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
        }
        body {
            font-family: sans-serif;
            background-color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .mobile-viewport {
            width: 375px;
            height: 812px;
            background-color: var(--color-bg-page);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            border: 8px solid #334155;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 40px var(--space-lg) var(--space-md);
            background-color: var(--color-bg-card);
            border-bottom: 1px solid #e2e8f0;
        }
        .header h1 {
            font-size: 22px;
            color: var(--color-text-primary);
            margin: 0;
        }
        .content {
            padding: var(--space-lg);
            flex: 1;
            overflow-y: auto;
        }
        .filter-section {
            margin-bottom: var(--space-lg);
        }
        .search-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-lg);
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: var(--space-md);
        }
        .result-item {
            background: var(--color-bg-card);
            padding: var(--space-md);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--space-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--color-success);
        }
        .result-item.rejected {
            border-left-color: var(--color-error);
        }
        .info h4 {
            margin: 0;
            font-size: 16px;
            color: var(--color-text-primary);
        }
        .info p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: var(--color-text-secondary);
        }
        .status {
            font-weight: bold;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .status.approved {
            color: var(--color-success);
            background: #d1fae5;
        }
        .status.rejected {
            color: var(--color-error);
            background: #fee2e2;
        }
        .footer {
            padding: var(--space-lg);
            background-color: var(--color-bg-card);
            border-top: 1px solid #e2e8f0;
        }
        .btn-primary {
            background-color: var(--color-primary);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: var(--radius-lg);
            text-decoration: none;
            display: block;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="mobile-viewport">
        <div class="header">
            <h1>Consulta de Justificaciones</h1>
        </div>
        <div class="content">
            <div class="filter-section">
                <input type="text" class="search-input" placeholder="Buscar por fecha o motivo...">
            </div>
            <div class="result-item">
                <div class="info">
                    <h4>Cita Médica</h4>
                    <p>05 Oct 2023 • Aprobada</p>
                </div>
                <div class="status approved">Aprobada</div>
            </div>
            <div class="result-item rejected">
                <div class="info">
                    <h4>Trámite Civil</h4>
                    <p>01 Oct 2023 • Rechazada</p>
                </div>
                <div class="status rejected">Rechazada</div>
            </div>
            <div class="result-item">
                <div class="info">
                    <h4>Emergencia Familiar</h4>
                    <p>25 Sep 2023 • Aprobada</p>
                </div>
                <div class="status approved">Aprobada</div>
            </div>
        </div>
        <div class="footer">
            <a href="#" class="btn-primary">Volver</a>
        </div>
    </div>
</body>
</html>
